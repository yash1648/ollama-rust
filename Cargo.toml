[package]
name = "ollama-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ollama-rs"
path = "src/main.rs"

[lib]
name = "ollama_rs"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.6", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "=1.6.1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
futures = "0.3"
bytes = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
sha2 = "0.10"
hex = "0.4"
indicatif = "0.17"
getrandom = "=0.2.15"
reqwest = { version = "0.11", default-features = false, features = ["native-tls", "stream"] }
tokio-util = "0.7"

# Real inference via Candle (HuggingFace Rust ML framework)
candle = { version = "0.11", package = "candle-core" }
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.23"
hf-hub = "0.4"
rand = "0.8"
async-trait = "0.1"
ahash = "0.8"
